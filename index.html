<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Ion Battle Nft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        h1 { color: #00ffff; font-size: 28px; margin-bottom: 20px; }
        .profile-card { background-color: #1e1e1e; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .user-name { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .balance-amount { color: #ffd700; font-size: 26px; font-weight: bold; margin-top: 5px; }
        .loader { border: 4px solid #333; border-top: 4px solid #00ffff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader" class="loader"></div>
    <div id="error-box" style="color: #ff4444; font-weight: bold; margin-top: 20px; font-size: 18px; padding: 10px;"></div>

    <div id="main-content" class="hidden">
        <h1>Ion Battle Nft</h1>
        <div class="profile-card">
            <div class="user-name" id="username">Загрузка...</div>
            <div class="balance-amount" id="balance">0 TON</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let user = tg.initDataUnsafe?.user;

        if (!user && tg.initData) {
            try {
                const urlParams = new URLSearchParams(tg.initData);
                const userStr = urlParams.get('user');
                if (userStr) {
                    user = JSON.parse(userStr);
                }
            } catch (e) {
                console.error("Ошибка парсинга initData", e);
            }
        }

        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('error-box');
        const mainContent = document.getElementById('main-content');

        async function loadProfile() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                const response = await fetch('/api/getProfile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error('Сервер вернул ошибку ' + response.status);

                const data = await response.json();
                document.getElementById('username').innerText = user.first_name;
                document.getElementById('balance').innerText = data.balance + ' TON';
                
                loader.classList.add('hidden');
                mainContent.classList.remove('hidden');
            } catch (err) {
                clearTimeout(timeoutId);
                loader.classList.add('hidden');
                errorBox.innerText = err.name === 'AbortError' 
                    ? 'Ошибка: Сервер не отвечает (превышено время ожидания)' 
                    : 'Ошибка: ' + err.message;
            }
        }

        if (user) {
            loadProfile();
        } else {
            loader.classList.add('hidden');
            errorBox.innerText = 'Ошибка: Не удалось получить данные от Telegram. Убедитесь, что вы открываете игру из бота.';
        }
    </script>

</body>
</html>
