<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Ion Battle Nft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 20px; }
        h1 { color: #00ffff; font-size: 28px; margin-bottom: 20px; }
        h2 { color: #fff; font-size: 20px; text-align: left; margin-top: 30px; }
        .profile-card { background-color: #1e1e1e; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0, 255, 255, 0.1); }
        .user-name { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .balance-label { color: #888; font-size: 14px; }
        .balance-amount { color: #ffd700; font-size: 26px; font-weight: bold; margin-top: 5px; }
        .message-box { font-size: 20px; font-weight: bold; margin: 20px 0; min-height: 30px; color: #00ff00; }
        .play-btn { padding: 18px 40px; font-size: 20px; background-color: #0088cc; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; }
        .play-btn:disabled { background-color: #555; }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .inv-item {
            background-color: #1e1e1e;
            padding: 15px 5px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h1>Ion Battle Nft</h1>

    <div class="profile-card">
        <div class="user-name" id="username">Загрузка...</div>
        <div class="balance-label">Твой баланс:</div>
        <div class="balance-amount" id="balance">...</div>
    </div>

    <div class="message-box" id="message"></div>
    <button class="play-btn" id="playBtn">Открыть кейс (10 TON)</button>

    <h2>🎒 Мой Инвентарь</h2>
    <div class="inventory-grid" id="inventory">
        <div style="color: #888; grid-column: span 3;">Пока пусто...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const playBtn = document.getElementById('playBtn');
        const balanceEl = document.getElementById('balance');
        const messageEl = document.getElementById('message');
        const inventoryEl = document.getElementById('inventory');

        async function loadInventory() {
            if (!user) return;
            const response = await fetch('/api/getInventory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id })
            });
            const data = await response.json();
            
            if (data.length > 0) {
                inventoryEl.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inv-item';
                    div.innerText = item.item_name;
                    inventoryEl.appendChild(div);
                });
            }
        }

        if (user) {
            document.getElementById('username').innerText = user.first_name;
            fetch('/api/getUser', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: user.id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.balance !== undefined) balanceEl.innerText = data.balance + ' TON';
            });
            loadInventory();
        }

        playBtn.addEventListener('click', async () => {
            if (!user) return;
            playBtn.disabled = true;
            playBtn.innerText = 'Крутим кейс...';
            messageEl.innerText = '';

            try {
                const response = await fetch('/api/openCase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id })
                });
                const data = await response.json();

                if (data.error) {
                    messageEl.style.color = '#ff4444';
                    messageEl.innerText = data.error;
                } else {
                    messageEl.style.color = '#00ff00';
                    messageEl.innerText = 'Вы выиграли: ' + data.prize;
                    balanceEl.innerText = data.newBalance + ' TON';
                    loadInventory();
                }
            } catch (err) {
                messageEl.style.color = '#ff4444';
                messageEl.innerText = 'Ошибка сети';
            }
            playBtn.disabled = false;
            playBtn.innerText = 'Открыть кейс (10 TON)';
        });
    </script>

</body>
</html>
