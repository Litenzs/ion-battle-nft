<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background-color: #121212; color: white; padding: 20px; font-family: monospace; font-size: 16px;">
    <h2 style="color: #00ffff;">DEBUG РЕЖИМ</h2>
    
    <p><b>Платформа:</b> <br><span id="platform" style="color: yellow;"></span></p>
    
    <p><b>initData (сырая строка):</b> <br><span id="initData" style="color: #ff8888; word-break: break-all;"></span></p>
    
    <p><b>initDataUnsafe (объект):</b> <br><span id="initDataUnsafe" style="color: #88ff88; word-break: break-all;"></span></p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('platform').innerText = tg.platform || 'НЕИЗВЕСТНО';
        
        document.getElementById('initData').innerText = tg.initData ? tg.initData : 'ПУСТО (Telegram не прислал данные)';
        
        document.getElementById('initDataUnsafe').innerText = tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length > 0 
            ? JSON.stringify(tg.initDataUnsafe) 
            : 'ПУСТО (объект пустой)';
    </script>
</body>
</html>
